- name: Microsoft Edge Stable aktualisieren
  hosts:
    - all
  gather_facts: false

  tasks:
    - name: Edge Stable direkt aktualisieren
      ansible.windows.win_shell: |
        Start-Process `
          -FilePath "C:\Program Files (x86)\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe" `
          -ArgumentList "/silent /install appguid={56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}&appname=Microsoft%20Edge&needsadmin=True" `
          -Wait
      changed_when: true
