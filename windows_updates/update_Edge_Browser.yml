---
- name: Microsoft Edge Stable aktualisieren
  hosts:
    - all
  gather_facts: false

  tasks:

    - name: Installierte Edge-Version ermitteln
      ansible.windows.win_shell: |
        $paths = @(
          "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
          "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
        )

        $path = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

        if (-not $path) {
            throw "Microsoft Edge wurde nicht gefunden."
        }

        (Get-Item $path).VersionInfo.ProductVersion
      register: edge_version_before
      changed_when: false

    - name: Edge Stable Update anstoßen
      ansible.windows.win_shell: |
        Start-ScheduledTask -TaskName "MicrosoftEdgeUpdateTaskMachineUA"
      changed_when: true

    - name: Auf Abschluss des Edge Update Tasks warten
      ansible.windows.win_shell: |
        $task = Get-ScheduledTaskInfo `
          -TaskName "MicrosoftEdgeUpdateTaskMachineUA"

        $task.LastRunTime
      register: edge_task
      changed_when: false

    - name: 30 Sekunden warten
      ansible.windows.win_shell: |
        Start-Sleep -Seconds 30
      changed_when: false

    - name: Edge-Version erneut ermitteln
      ansible.windows.win_shell: |
        $paths = @(
          "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
          "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
        )

        $path = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

        if (-not $path) {
            throw "Microsoft Edge wurde nicht gefunden."
        }

        (Get-Item $path).VersionInfo.ProductVersion
      register: edge_version_after
      changed_when: false

    - name: Ergebnis anzeigen
      ansible.builtin.debug:
        msg:
          - "Edge vorher: {{ edge_version_before.stdout | trim }}"
          - "Edge nachher: {{ edge_version_after.stdout | trim }}"
